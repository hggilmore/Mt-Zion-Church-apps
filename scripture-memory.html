/* ---------- Basics ---------- */
function pad(n){return n<10?"0"+n:""+n}
function dk(x){var d=(x instanceof Date)?x:new Date(x);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function addDays(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()}
function uid(){return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sid(ref){return "st_"+ref.toLowerCase().replace(/[^a-z0-9]+/g,"_")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function oc(fn,id){return "onclick='"+fn+"(\""+id+"\")'"}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function byAdded(a,b){return (a.added||0)-(b.added||0)}
function byName(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1}
function allStarters(){return STARTERS.concat(MORE)}
function blank(){return {verses:[],sets:[],deleted:{},history:{},settings:{goal:3,defTrans:"KJV",weekly:null,setsSeeded:false,u:0}}}
function byId(id){for(var i=0;i<S.verses.length;i++)if(S.verses[i].id===id)return S.verses[i];return null}
function getSet(id){for(var i=0;i<S.sets.length;i++)if(S.sets[i].id===id)return S.sets[i];return null}
function refExists(ref){var r=ref.toLowerCase();for(var i=0;i<S.verses.length;i++)if(S.verses[i].ref.toLowerCase()===r)return true;return false}
function isWeak(v){return (v.miss||0)>0&&v.box<=2}
function dueList(){return S.verses.filter(function(v){return v.due<=today()}).sort(function(a,b){return a.due-b.due})}
function weakList(){return S.verses.filter(isWeak)}
function boxName(b){return ["New","Learning","Learning","Growing","Strong","Mastered"][b]||"New"}
function ids(list){return list.map(function(v){return v.id})}

/* ---------- Saving and loading ---------- */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function devSave(){try{localStorage.setItem(DKEY,JSON.stringify(DEV))}catch(e){}}
function save(){saveLocal();scheduleSync()}

function ensure(){
  S.verses=S.verses||[];S.sets=S.sets||[];S.deleted=S.deleted||{};S.history=S.history||{};S.settings=S.settings||{};
  if(!S.settings.goal)S.settings.goal=3;
  if(!S.settings.defTrans)S.settings.defTrans="KJV";
  if(S.settings.u==null)S.settings.u=0;
  var map={};allStarters().forEach(function(s){map[s[0].toLowerCase()+"|"+s[1]]=sid(s[0])});
  S.verses.forEach(function(v){
    var k=v.ref.toLowerCase()+"|"+v.text;
    if(map[k]&&v.id!==map[k]&&!byId(map[k]))v.id=map[k];
    if(v.u==null)v.u=v.added||0;
    if(v.miss==null)v.miss=0;
    if(!v.sets)v.sets=[];
  });
  S.sets.forEach(function(s){if(s.u==null)s.u=0});
}
function applyStarterSets(){
  SETDEFS.forEach(function(d){
    var set=getSet(d[0]);
    if(!set){if(S.deleted[d[0]])return;set={id:d[0],name:d[1],u:0};S.sets.push(set)}
    d[2].split("|").forEach(function(ref){
      var v=byId(sid(ref));
      if(v&&v.sets.indexOf(d[0])<0)v.sets.push(d[0]);
    });
  });
}
function addStarters(){
  var n=0,t=Date.now();
  allStarters().forEach(function(s,i){
    var id=sid(s[0]);
    if(byId(id)||refExists(s[0]))return;
    var wasDeleted=!!S.deleted[id];
    delete S.deleted[id];
    S.verses.push({id:id,ref:s[0],text:s[1],version:"KJV",box:0,due:today(),added:t+i,reps:0,miss:0,sets:[],u:wasDeleted?t:0});
    n++;
  });
  applyStarterSets();
  return n;
}
function prep(){
  ensure();
  if(!S.settings.setsSeeded){applyStarterSets();S.settings.setsSeeded=true;}
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){S=null}
  try{var d=localStorage.getItem(DKEY);if(d){var o=JSON.parse(d);for(var k in o)DEV[k]=o[k]}}catch(e){}
  if(!S||!S.verses){S=blank();ensure();addStarters();S.settings.setsSeeded=true;saveLocal();return}
  prep();saveLocal();
}

/* ---------- Sync (JSONBin v3) ---------- */
var syncTimer=null,syncBusy=false;
function newer(x,y){return (y.u||0)>(x.u||0)?y:x}
function mergeList(la,lb,del){
  var m={};
  la.forEach(function(x){m[x.id]=x});
  lb.forEach(function(y){m[y.id]=m[y.id]?newer(m[y.id],y):y});
  var out=[];
  for(var id in m){var x=m[id];if(del[id]&&del[id]>=(x.u||0))continue;out.push(x)}
  return out;
}
function merge(a,b){
  var del={},h={};
  [a.deleted||{},b.deleted||{}].forEach(function(d){for(var k in d)del[k]=Math.max(del[k]||0,d[k])});
  [a.history||{},b.history||{}].forEach(function(o){for(var k in o)h[k]=Math.max(h[k]||0,o[k])});
  var sa=a.settings||{u:0},sb=b.settings||{u:0};
  return {verses:mergeList(a.verses||[],b.verses||[],del),sets:mergeList(a.sets||[],b.sets||[],del),deleted:del,history:h,settings:(sb.u||0)>(sa.u||0)?sb:sa};
}
function setStatus(t){DEV.status=t;var el=document.getElementById("syncstat");if(el)el.textContent=t}
function scheduleSync(){
  if(!DEV.key||!DEV.bin)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){syncNow(true)},2500);
}
function binUrl(){return "https://api.jsonbin.io/v3/b/"+encodeURIComponent(DEV.bin)}
function syncNow(quiet){
  if(!DEV.key||!DEV.bin){
    if(!quiet)notice("Sync is not set up","Open Settings, enter your JSONBin Master Key and Bin ID, then try again.");
    return Promise.resolve();
  }
  if(syncBusy)return Promise.resolve();
  syncBusy=true;setStatus("Syncing...");
  return fetch(binUrl()+"/latest",{headers:{"X-Master-Key":DEV.key}})
  .then(function(r){if(!r.ok)throw new Error("could not read the bin (code "+r.status+")");return r.json()})
  .then(function(j){
    var remote=j.record;
    if(remote&&remote.verses){S=merge(S,remote);prep();saveLocal()}
    return fetch(binUrl(),{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":DEV.key},body:JSON.stringify(S)});
  })
  .then(function(r){
    if(!r.ok)throw new Error("could not save to the bin (code "+r.status+")");
    DEV.lastSync=new Date().toLocaleString();devSave();syncBusy=false;
    setStatus("Last synced "+DEV.lastSync);
    if(!quiet)render();
  })
  .catch(function(e){
    syncBusy=false;setStatus("Sync problem: "+e.message);
    if(!quiet)notice("Sync problem","Sync failed: "+e.message+". Check your key and Bin ID, and make sure you are using your github.io address and not the Claude preview.");
  });
}
function createBin(){
  var key=(document.getElementById("s_key").value||"").trim();
  if(!key){notice("Master Key needed","Paste your JSONBin Master Key first.");return}
  setStatus("Creating bin...");
  fetch("https://api.jsonbin.io/v3/b",{method:"POST",headers:{"Content-Type":"application/json","X-Master-Key":key,"X-Bin-Private":"true","X-Bin-Name":"scripture-memory"},body:JSON.stringify(S)})
  .then(function(r){if(!r.ok)throw new Error("code "+r.status);return r.json()})
  .then(function(j){
    DEV.key=key;DEV.bin=j.metadata.id;DEV.lastSync=new Date().toLocaleString();devSave();
    setStatus("Last synced "+DEV.lastSync);render();
    notice("Bin created","Your Bin ID is "+DEV.bin+". On your other devices, enter this same Master Key and Bin ID in Settings.");
  })
  .catch(function(e){setStatus("Could not create bin: "+e.message);notice("Could not create bin","JSONBin said: "+e.message+". Check the key, and use your github.io address.")});
}
function saveSync(){

function streak(){
  var d=new Date();d.setHours(0,0,0,0);
  if(!(S.history[dk(d)]>0))d.setDate(d.getDate()-1);
  var n=0;
  while(S.history[dk(d)]>0){n++;d.setDate(d.getDate()-1)}
  return n;
}
function weekKey(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return dk(d)}
function weeklyVerse(){var w=S.settings.weekly;return (w&&w.wk===weekKey())?byId(w.id):null}
function setWeekly(id,say){
  S.settings.weekly={id:id,wk:weekKey()};S.settings.u=Date.now();save();
  if(say){var v=byId(id);notice("Verse of the week",v.ref+" is now your verse of the week.")}
  render();
}
function pickWeekly(){
  var cur=S.settings.weekly&&S.settings.weekly.id;
  var pool=S.verses.filter(function(v){return v.box<5&&v.id!==cur});
  if(!pool.length)pool=S.verses.filter(function(v){return v.id!==cur});
  if(!pool.length)return;
  setWeekly(pool[Math.floor(Math.random()*pool.length)].id,false);
}

function runQueue(list){

}

}

}
function practice(id){queue=[];qTotal=0;curId=id;mode="read";go("practice")}
function listen(id){speak(byId(id),1)}

/* ---------- Listen ---------- */
function speechText(v){
  var r=v.ref.replace(/(\d)[a-z]$/,"$1").replace(/(\d+):(\d+)-(\d+)/,"$1 verses $2 to $3").replace(/(\d+):(\d+)/,"$1 verse $2");
  return r+". "+v.text;
}
function stopSpeak(){spk++;try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function speak(v,times){
  if(!v)return;
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){notice("Not available","This browser cannot read aloud.");return}
  stopSpeak();
  var my=spk,n=times||1;
  (function say(i){
    if(i>=n||my!==spk)return;
    var u=new SpeechSynthesisUtterance(speechText(v));
    u.rate=DEV.rate||0.9;u.lang="en-US";
    u.onend=function(){if(my===spk)setTimeout(function(){say(i+1)},700)};
    speechSynthesis.speak(u);
  })(0);
}
function setRate(val){DEV.rate=parseFloat(val);devSave()}

function tokens(text){
  return text.split(/\s+/).filter(Boolean).map(function(t){
    var m=t.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);
    return {pre:m[1],w:m[2],post:m[3]};
  });
}
function wirePractice(){
  var v=byId(curId);if(!v)return;
  var mb=document.getElementById("modes");
  mb.onclick=function(e){var m=e.target.getAttribute("data-m");if(!m)return;mode=m;render()};
  var b=document.getElementById("pbody"),t=tokens(v.text),h="";
  if(mode==="read"){
    h="<div class='verse'>"+esc(v.text)+"</div><p class='muted'>Read it aloud three times, then try Blanks.</p>";
  }else if(mode==="blanks"){
    h="<div class='modes' id='lv'>";
    [[0.25,"Easy"],[0.5,"Medium"],[0.75,"Hard"],[1,"All"]].forEach(function(l){h+="<button data-l='"+l[0]+"' class='"+(level===l[0]?"on":"")+"'>"+l[1]+"</button>"});
    h+="</div><div class='verse' id='vtxt'>";
    var seed=0;for(var i=0;i<v.id.length;i++)seed+=v.id.charCodeAt(i);
    var idx=t.map(function(_,i){return i}),order=idx.slice().sort(function(a,b){return ((a*7919+seed)%97)-((b*7919+seed)%97)||a-b});
    var hide={},cnt=Math.max(1,Math.round(t.length*level));
    for(var k=0;k<cnt;k++)hide[order[k]]=1;
    t.forEach(function(x,i){
      h+=esc(x.pre)+(hide[i]?"<span class='blank' title='Tap to reveal'>"+esc(x.w)+"</span>":esc(x.w))+esc(x.post)+" ";
    });
    h+="</div><p class='muted'>Say the verse out loud. Tap a blank to check yourself.</p>";
  }else if(mode==="letters"){
    h="<div class='verse' id='vtxt'>";
    t.forEach(function(x){h+=esc(x.pre)+"<b>"+esc(x.w.charAt(0))+"</b>"+esc(x.w.slice(1).replace(/./g,"_"))+esc(x.post)+" "});
    h+="</div><p><button class='btn alt sm' id='showfull'>Show full verse</button></p>";
  }else if(mode==="type"){
    h="<label>Type the verse from memory</label><textarea id='typed' placeholder='Type here'></textarea><p class='row'><button class='btn' id='chk'>Check</button></p><div id='res'></div>";
  }else{
    if(!SR){
      h="<p>Speaking is not supported in this browser. Chrome on Android, Safari on iPhone, and Edge usually work. You can still use Type it.</p>";
    }else{
      h="<p class='muted'>Tap Start and say the verse out loud. Your words appear below. Fix any mistakes, then tap Check.</p><p class='row'><button class='btn' id='mic'>Start speaking</button></p><div id='micmsg' class='muted'></div><textarea id='typed' placeholder='Your spoken words appear here'></textarea><p class='row'><button class='btn' id='chk'>Check</button></p><div id='res'></div>";
    }
  }
  b.innerHTML=h;
  var lv=document.getElementById("lv");
  if(lv)lv.onclick=function(e){var l=e.target.getAttribute("data-l");if(!l)return;level=parseFloat(l);render()};
  var vt=document.getElementById("vtxt");
  if(vt&&mode==="blanks")vt.onclick=function(e){if(e.target.className.indexOf("blank")===0)e.target.classList.toggle("open")};
  var sf=document.getElementById("showfull");
  if(sf)sf.onclick=function(){document.getElementById("vtxt").innerHTML=esc(v.text);sf.remove()};
  var ck=document.getElementById("chk");
  if(ck)ck.onclick=function(){checkTyped(v)};
  var mic=document.getElementById("mic");
  if(mic)mic.onclick=function(){toggleMic(mic)};
}
function toggleMic(btn){
  var ta=document.getElementById("typed"),msg=document.getElementById("micmsg");
  if(rec){stopMic();btn.textContent="Start speaking";return}
  try{
    var r=new SR();rec=r;
    r.lang="en-US";r.continuous=true;r.interimResults=true;
    var base=ta.value?ta.value+" ":"",finalT="";
    r.onresult=function(e){
      var interim="";
      for(var i=e.resultIndex;i<e.results.length;i++){
        var res=e.results[i];
        if(res.isFinal)finalT+=res[0].transcript+" ";else interim+=res[0].transcript;
      }
      ta.value=base+finalT+interim;
    };
    r.onerror=function(e){
      var t=e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked. Allow microphone access for this page and try again. This works from your github.io address, not the Claude preview.":"Microphone problem: "+e.error;
      if(msg)msg.textContent=t;
    };
    r.onend=function(){if(rec===r)rec=null;btn.textContent="Start speaking"};
    r.start();btn.textContent="Stop";
    if(msg)msg.textContent="Listening...";
  }catch(err){if(msg)msg.textContent="Could not start the microphone.";rec=null}
}
function norm(w){return w.toLowerCase().replace(/[^a-z0-9]/g,"")}
function checkTyped(v){
  var typed=document.getElementById("typed").value.split(/\s+/).filter(Boolean).map(norm).filter(Boolean);
  var orig=tokens(v.text),o=orig.map(function(x){return norm(x.w)});
  var n=o.length,m=typed.length,dp=[],i,j;
  for(i=0;i<=n;i++){dp[i]=[];for(j=0;j<=m;j++)dp[i][j]=0}
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=o[i-1]===typed[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var hit={};i=n;j=m;
  while(i>0&&j>0){if(o[i-1]===typed[j-1]){hit[i-1]=1;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  var score=n?Math.round(dp[n][m]/n*100):0,h="<p><b>"+score+"% correct.</b> Words in red were missed.</p><div class='verse'>";
  orig.forEach(function(x,k){h+=esc(x.pre)+"<span class='"+(hit[k]?"ok":"miss")+"'>"+esc(x.w)+"</span>"+esc(x.post)+" "});
  document.getElementById("res").innerHTML=h+"</div>";
}
function grade(ok){
  var v=byId(curId);if(!v)return;
  stopSpeak();stopMic();
  v.reps=(v.reps||0)+1;
  if(ok){v.box=Math.min(5,v.box+1);v.due=addDays(GAPS[v.box])}
  else{v.box=0;v.miss=(v.miss||0)+1;v.due=addDays(1)}
  v.u=Date.now();
  var k=dk(new Date());S.history[k]=(S.history[k]||0)+1;
  save();
  if(queue.length){nextInQueue();return}
  var goal=S.settings.goal||3,done=S.history[k]||0;
  var msg=ok?"Well done. This verse will come back "+(v.box>=5?"in about two weeks.":"in "+GAPS[v.box]+" day"+(GAPS[v.box]===1?"":"s")+"."):"No problem. It will come back tomorrow and show under weak verses until it sticks.";
  if(done>=goal)msg+=" You reached your daily goal.";
  var finished=qTotal>0;
  curId=null;qTotal=0;
  modal(finished?"Session complete":(ok?"Saved":"Keep going"),"<p>"+esc(msg)+"</p>",[{label:"OK",fn:function(){go("today")}}]);
}

function matchLib(v){

  if(lib.st==="due"&&v.due>today())return false;
  if(lib.st==="weak"&&!isWeak(v))return false;

  S.sets.slice().sort(byName).forEach(function(s){
    var c=S.verses.filter(function(v){return v.sets.indexOf(s.id)>=0}).length;
    h+="<div class='row sp' style='margin:6px 0'><span>"+esc(s.name)+" <span class='muted'>("+c+")</span></span><span class='row'><button class='btn alt sm' "+oc("renameSet",s.id)+">Rename</button><button class='btn alt sm' "+oc("delSet",s.id)+">Delete</button></span></div>";
  });
  h+="<div class='row' style='margin-top:10px'><input type='text' id='newset' placeholder='New set name' style='flex:1;min-width:180px'><button class='btn sm' onclick='addSet()'>Add set</button></div></div>";
  return h;
}
function addSet(){
  var n=(document.getElementById("newset").value||"").trim();
  if(!n)return;
  for(var i=0;i<S.sets.length;i++)if(S.sets[i].name.toLowerCase()===n.toLowerCase()){notice("Already there","You already have a set with that name.");return}
  S.sets.push({id:"s_"+uid(),name:n,u:Date.now()});save();render();
}
function renameSet(id){
  var s=getSet(id);if(!s)return;
  modal("Rename set","<label>Set name</label><input type='text' id='rn' value='"+esc(s.name)+"'>",[{label:"Cancel",cls:"alt"},{label:"Save",fn:function(m){
    var n=m.querySelector("#rn").value.trim();
    if(!n){notice("Name needed","Please enter a name.");return false}
    s.name=n;s.u=Date.now();save();render();
  }}]);
}
function delSet(id){
  var s=getSet(id);if(!s)return;
  confirmBox("Delete set","Delete the set "+s.name+"? The verses stay in your Library.","Delete",function(){
    var t=Date.now();
    S.sets=S.sets.filter(function(x){return x.id!==id});
    S.deleted[id]=t;
    S.verses.forEach(function(v){var i=v.sets.indexOf(id);if(i>=0){v.sets.splice(i,1);v.u=t}});
    if(lib.set===id)lib.set="";
    if(pset===id)pset="";
    save();render();
  });
}
function loadStarters(){
  var n=addStarters();save();render();
  notice(n?"Verses added":"Up to date",n?n+" starter verses were added, and the starter sets were refreshed.":"All starter verses are already in your Library. The starter sets were refreshed.");
}
function editVerse(id,copyId){
  var v=id?byId(id):null,src=copyId?byId(copyId):null;
  var ref=v?v.ref:(src?src.ref:""),ver=v?(v.version||""):(src?"":(S.settings.defTrans||"KJV")),txt=v?v.text:"";
  var sel=v?v.sets:(src?src.sets:(lib.set?[lib.set]:[]));
  var body="<label>Reference</label><input type='text' id='f_ref' placeholder='Example: Psalm 46:1' value='"+esc(ref)+"'>"+
  "<label>Translation</label><input type='text' id='f_ver' list='tlist' placeholder='KJV' value='"+esc(ver)+"'><datalist id='tlist'>"+translations().map(function(t){return "<option value='"+esc(t)+"'>"}).join("")+"</datalist>"+
  "<label>Verse text</label><textarea id='f_txt' placeholder='Type or paste the verse'>"+esc(txt)+"</textarea>"+
  "<p class='muted'>Newer translations such as NKJV and ESV are copyrighted, so type or paste those yourself.</p><label>Sets</label>";
  S.sets.slice().sort(byName).forEach(function(s){
    body+="<label class='chk'><input type='checkbox' class='setchk' value='"+esc(s.id)+"'"+(sel.indexOf(s.id)>=0?" checked":"")+"> "+esc(s.name)+"</label>";
  });
  var title=v?"Edit verse":(src?"Add another translation":"Add verse");
  modal(title,body,[{label:"Cancel",cls:"alt"},{label:"Save",fn:function(m){
    var r=m.querySelector("#f_ref").value.trim(),t=m.querySelector("#f_txt").value.replace(/\s+/g," ").trim(),vr=m.querySelector("#f_ver").value.trim();
    if(!r||!t){notice("Missing information","Please enter both the reference and the verse text.");return false}
    var picked=[].slice.call(m.querySelectorAll(".setchk")).filter(function(c){return c.checked}).map(function(c){return c.value});
    var now=Date.now();
    if(v){v.ref=r;v.text=t;v.version=vr;v.sets=picked;v.u=now}
    else S.verses.push({id:uid(),ref:r,text:t,version:vr,box:0,due:today(),added:now,reps:0,miss:0,sets:picked,u:now});
    save();render();
  }}]);
}
function delVerse(id){
  var v=byId(id);if(!v)return;
  confirmBox("Delete verse","Delete "+v.ref+" ("+(v.version||"no translation")+")? This cannot be undone.","Delete",function(){
    S.verses=S.verses.filter(function(x){return x.id!==id});
    S.deleted[id]=Date.now();
    if(S.settings.weekly&&S.settings.weekly.id===id){S.settings.weekly=null;S.settings.u=Date.now()}
    save();render();
  });
}

/* ---------- Settings ---------- */
function setGoal(val){S.settings.goal=parseInt(val,10)||3;S.settings.u=Date.now();save()}
function setDef(val){S.settings.defTrans=(val||"").trim()||"KJV";S.settings.u=Date.now();save()}
function setRemindTime(val){DEV.remindTime=val||"08:00";devSave()}
function toggleNote(on){
  if(!on){DEV.remindOn=false;devSave();return}
  if(!window.Notification){notice("Not available","This browser does not support notices. Use the calendar reminder instead.");document.getElementById("rnote").checked=false;return}
  Notification.requestPermission().then(function(p){
    if(p==="granted"){DEV.remindOn=true;devSave()}
    else{DEV.remindOn=false;devSave();document.getElementById("rnote").checked=false;notice("Notices blocked","Allow notices for this page in your browser settings, or use the calendar reminder.")}
  });
}
function downloadReminder(){
  var t=(DEV.remindTime||"08:00").split(":"),now=new Date();
  var start=dk(now).replace(/-/g,"")+"T"+t[0]+t[1]+"00";
  var stamp=now.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  var url=location.protocol.indexOf("http")===0?location.href.split("#")[0]:"";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mt Zion//Scripture Memory//EN","BEGIN:VEVENT","UID:scripture-memory-daily@mtzion","DTSTAMP:"+stamp,"DTSTART:"+start,"DURATION:PT15M","RRULE:FREQ=DAILY","SUMMARY:Scripture memory review","DESCRIPTION:Time to review your verses."+(url?" "+url:"")];
  if(url)L.push("URL:"+url);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Scripture memory review","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR");
  downloadText(L.join("\r\n"),"scripture-memory-reminder.ics","text/calendar");
}
function downloadText(text,name,type){
  var b=new Blob([text],{type:type});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function maybeNotify(){
  try{
    if(DEV.remindOn&&window.Notification&&Notification.permission==="granted"){
      var n=dueList().length;
      if(n)new Notification("Scripture Memory",{body:n+" verse"+(n===1?"":"s")+" ready to review today."});
    }
  }catch(e){}
}
function renderSettings(){
  var goal=S.settings.goal||3,h="";
  h+="<div class='card'><h2>Daily goal and defaults</h2><label>Verses to practice each day</label><select onchange='setGoal(this.value)'>";
  [1,2,3,4,5,6,8,10].forEach(function(n){h+="<option value='"+n+"'"+(goal===n?" selected":"")+">"+n+"</option>"});
  h+="</select><label>Translation for new verses</label><input type='text' value='"+esc(S.settings.defTrans||"KJV")+"' onchange='setDef(this.value)'></div>";
  h+="<div class='card'><h2>Reminders</h2><p class='muted'>The best daily alert is your calendar. Pick a time, download the reminder, then open the file on your phone or computer to add it to your calendar.</p><label>Time of day</label><input type='time' value='"+esc(DEV.remindTime||"08:00")+"' onchange='setRemindTime(this.value)'><p class='row'><button class='btn' onclick='downloadReminder()'>Download daily reminder</button></p>"+
  "<label class='chk'><input type='checkbox' id='rnote'"+(DEV.remindOn?" checked":"")+" onchange='toggleNote(this.checked)'> Also show a notice when I open this app and verses are due</label></div>";
  h+="<div class='card'><h2>Sync between devices</h2><p class='muted'>1. Make a free account at jsonbin.io. 2. Copy your Master Key from the API Keys page. 3. Paste it below and tap Create new bin. 4. On every other device, paste the same Master Key and the Bin ID shown here, then tap Save.</p>"+
  "<label>JSONBin Master Key</label><input type='password' id='s_key' value='"+esc(DEV.key)+"' autocomplete='off'><label>Bin ID</label><input type='text' id='s_bin' value='"+esc(DEV.bin)+"' autocomplete='off'>"+
  "<p class='row'><button class='btn' onclick='saveSync()'>Save</button><button class='btn alt' onclick='createBin()'>Create new bin</button><button class='btn alt' onclick='syncNow(false)'>Sync now</button></p>"+
  "<p class='muted' id='syncstat'>"+esc(DEV.status||(DEV.bin?"Ready":"Not set up"))+"</p><p class='muted'>Your key stays on this device only. Test syncing from your github.io address; it will not work inside the Claude preview.</p></div>";
  h+="<div class='card'><h2>Backup</h2><p>Download a backup file to keep your verses safe, or restore from one.</p><p><button class='btn' onclick='doExport()'>Download backup</button></p><label>Restore from a backup file</label><input type='file' id='impf' accept='.json,application/json'><p><button class='btn alt' onclick='doImport()'>Restore</button></p></div>";
  return h;
}
function doExport(){downloadText(JSON.stringify(S,null,2),"scripture-memory-backup.json","application/json")}
function doImport(){
  var f=document.getElementById("impf").files[0];
  if(!f){notice("No file","Choose a backup file first.");return}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(!d.verses||!d.verses.length)throw 0;
      confirmBox("Restore backup","This replaces the verses on this device with the "+d.verses.length+" in the file.","Restore",function(){
        var t=Date.now();
        d.verses.forEach(function(v){v.u=t});
        S=d;prep();S.settings.u=t;save();go("today");
      });
    }catch(e){notice("Problem","That file does not look like a Scripture Memory backup.")}
  };
  rd.readAsText(f);
}

/* ---------- Start ---------- */
load();
render();
maybeNotify();
if(DEV.key&&DEV.bin){
  syncNow(true).then(function(){if(view==="today")render()});
  document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow(true)});
}

</script>
</body>
</html>
